[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "siphon"
version = "1.1.0"
description = "Download from any site you add, upload to the cloud"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Efe0729", email = "Efe0729@users.noreply.github.com" }]
dependencies = [
  "requests>=2.28.0",
  "PySocks>=1.7.1",
  "beautifulsoup4>=4.11.0",
  "m3u8>=3.0.0",
  "pycryptodome>=3.15.0",
  "cloudscraper>=1.2.68",
  "Pillow>=9.2.0",
  "customtkinter>=5.2.0",
  "curl_cffi>=0.7.0",
  "imageio-ffmpeg>=0.5.1",
]
keywords = [
  "video-downloader",
  "downloader",
  "gdrive-upload",
  "rclone",
  "desktop-app",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-timeout>=2.3",
]

[project.urls]
Homepage = "https://github.com/Efe0729/Siphon"
Releases = "https://github.com/Efe0729/Siphon/releases"
Issues = "https://github.com/Efe0729/Siphon/issues"

[project.scripts]
siphon = "siphon.cli.main:main"
siphon-cli = "siphon.cli.headless:main"

[project.gui-scripts]
siphon-app = "siphon.entrypoints.browse:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
# curl_cffi streams in its own chunk size and says so on every read; the
# value is still needed for the plain requests client, so only the notice goes.
filterwarnings = ["ignore:chunk_size is ignored"]
