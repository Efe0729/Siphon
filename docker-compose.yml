# NAS-friendly compose. Put URLs (one per line) in ./downloads/urls.txt, then:
#   docker compose run --rm siphon               # downloads everything in urls.txt
#   docker compose run --rm siphon <URL> [<URL>] # or pass URL(s) directly
# Videos land in ./downloads on the host.
services:
  siphon:
    # No image is published: compose builds it from this folder.
    build: .
    image: siphon:local
    container_name: siphon
    volumes:
      - ./downloads:/downloads
    environment:
      - RESOLUTION=highest        # highest | 1080 | 720 | 480
      - MAX_WORKERS_PER_VIDEO=8   # max 1..16; lower to reduce proxy load
      - URLS_FILE=/downloads/urls.txt
    # This is a run-to-completion job, not a long-running service:
    restart: "no"

  # Opt-in only: export a random SIPHON_WEB_TOKEN, then
  # docker compose --profile web up -d siphon-web
  siphon-web:
    profiles: [web]
    build: .
    image: siphon:local
    container_name: siphon-web
    entrypoint: ["python", "-u", "-m", "siphon.web"]
    ports:
      # Keep loopback-only; use an authenticated TLS reverse proxy or VPN.
      - "127.0.0.1:8765:8765"
    volumes:
      - ./downloads:/downloads
      - siphon-web-state:/state
    environment:
      SIPHON_WEB_HOST: "0.0.0.0"
      SIPHON_WEB_TOKEN: "${SIPHON_WEB_TOKEN:-}"
      SIPHON_WEB_ALLOWED_HOSTS: "${SIPHON_WEB_ALLOWED_HOSTS:-localhost:8765,127.0.0.1:8765}"
    init: true
    stop_grace_period: 45s
    restart: unless-stopped

volumes:
  siphon-web-state:
